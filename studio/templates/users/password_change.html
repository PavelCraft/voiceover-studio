{% extends "studio/base.html" %}
{% load i18n %}
{% block title %}{% trans "Change password — Voiceover Studio" %}{% endblock %}
{% block content %}
<section class="auth-card card">
  <p class="step">{% trans "Account" %}</p>
  <h1>{% trans "Change password" %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button primary" type="submit">{% trans "Save new password" %}</button>
  </form>
</section>
{% endblock %}
